[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anydoc"
dynamic = ["version"]
description = "Universal document viewer, converter and editor toolkit."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "typer>=0.12",  # MIT
]

[project.scripts]
anydoc = "anydoc.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    # sample generation / library round-trip checks (all MIT/BSD/HPND)
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "reportlab>=4",
    "pypdf>=4",
    "pdfplumber>=0.11",
    "ezdxf>=1.3",
    "pillow>=10",
]

[tool.hatch.version]
path = "src/anydoc/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/anydoc"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "requires(tool): skip the test when the named external tool is not installed",
]

[tool.coverage.run]
source = ["anydoc"]
branch = true

[tool.coverage.report]
show_missing = true
