[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anydoc"
dynamic = ["version"]
description = "Universal document viewer, converter and editor toolkit."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "typer>=0.12",  # MIT
    "pyyaml>=6",  # MIT
    "defusedxml>=0.7",  # PSF
    "python-docx>=1.1",  # MIT
    "openpyxl>=3.1",  # MIT
    "python-pptx>=1.0",  # MIT
    "pypdf>=4",  # BSD
    "pdfplumber>=0.11",  # MIT
    "pypdfium2>=4",  # Apache-2.0/BSD
    "pillow>=10",  # HPND (PNG encoding for rendered pages)
]

[project.scripts]
anydoc = "anydoc.cli:main"

[project.entry-points."anydoc.formats"]
csv = "anydoc.formats.csv:CsvHandler"
txt = "anydoc.formats.text:TxtHandler"
markdown = "anydoc.formats.text:MarkdownHandler"
json = "anydoc.formats.text:JsonHandler"
yaml = "anydoc.formats.text:YamlHandler"
xml = "anydoc.formats.text:XmlHandler"
tsv = "anydoc.formats.csv:TsvHandler"
docx = "anydoc.formats.docx:DocxHandler"
xlsx = "anydoc.formats.xlsx:XlsxHandler"
pptx = "anydoc.formats.pptx:PptxHandler"
pdf = "anydoc.formats.pdf:PdfHandler"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "types-defusedxml",
    "types-openpyxl",
    # sample generation / library round-trip checks (all MIT/BSD/HPND)
    "reportlab>=4",
    "ezdxf>=1.3",
]

[tool.hatch.version]
path = "src/anydoc/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/anydoc"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "requires(tool): skip the test when the named external tool is not installed",
]

[tool.coverage.run]
source = ["anydoc"]
branch = true

[tool.coverage.report]
show_missing = true
